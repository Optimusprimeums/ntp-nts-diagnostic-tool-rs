# Checks every push and pull request. Releases are made by release.yml.
name: Windows Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Build release executables
        run: cargo build --release --locked
      - name: Self-test the built CLI
        run: target\release\ntpnts.exe self-test
      - name: Build the installer
        shell: pwsh
        run: |
          $env:NTPNTS_GUI_EXE = "$PWD\target\release\NTP-NTS-Diagnostic-Tool.exe"
          $env:NTPNTS_CLI_EXE = "$PWD\target\release\ntpnts.exe"
          cargo clippy --locked -p ntpnts-setup --release -- -D warnings
          cargo build --locked --release -p ntpnts-setup
      - name: Check the docs render
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/pub" "$RUNNER_TEMP/wiki"
          bash scripts/publish-docs.sh "$RUNNER_TEMP/pub" "$RUNNER_TEMP/wiki"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: NTP-NTS-Diagnostic-Tool-Windows
          path: |
            target/release/NTP-NTS-Diagnostic-Tool.exe
            target/release/ntpnts.exe
            target/release/setup.exe
          if-no-files-found: error
