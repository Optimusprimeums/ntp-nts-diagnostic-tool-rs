# A tag such as v3.1.0 tests, builds and publishes a release, then updates the
# website and wiki. A version with a hyphen, such as v3.2.0-beta.1, is marked as
# a pre-release. Running this by hand does everything but publish, and leaves
# the files on the run; tick publish_docs to update the website and wiki too.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish_docs:
        description: Update the website and wiki from docs/
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Find the version
        id: version
        shell: pwsh
        run: |
          $version = (cargo pkgid -p ntp_nts_diag) -replace '.*[@#]', ''
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME doesn't match version $version"
          }
          if ((Get-Content VERSION -Raw).Trim() -ne $version) { throw "VERSION file doesn't match $version" }
          if (-not (Select-String -Path CHANGELOG.md -SimpleMatch "## [$version]" -Quiet)) { throw "CHANGELOG.md has no section for $version" }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Build the programs
        run: cargo build --locked --release
      - name: Self-test the command line
        run: target\release\ntpnts.exe self-test
      - name: Build the installer
        shell: pwsh
        run: |
          $env:NTPNTS_GUI_EXE = "$PWD\target\release\NTP-NTS-Diagnostic-Tool.exe"
          $env:NTPNTS_CLI_EXE = "$PWD\target\release\ntpnts.exe"
          cargo clippy --locked -p ntpnts-setup --release -- -D warnings
          cargo build --locked --release -p ntpnts-setup
      - name: Package
        shell: pwsh
        run: |
          $name = "NTP-NTS-Diagnostic-Tool-${{ steps.version.outputs.version }}"
          New-Item -ItemType Directory out, $name | Out-Null
          foreach ($file in 'NTP-NTS-Diagnostic-Tool', 'ntpnts') {
            Copy-Item "target\release\$file.exe" $name
          }
          Copy-Item LICENSE "$name\LICENSE.txt"
          Compress-Archive $name "out\$name-portable.zip"
          Copy-Item target\release\setup.exe "out\$name-setup.exe"
          Push-Location out
          Get-ChildItem | ForEach-Object { "$((Get-FileHash $_.Name -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content -Encoding ascii SHA256SUMS.txt
          Pop-Location
      - name: Check every program has the icon
        shell: pwsh
        run: |
          Add-Type @'
          using System; using System.Runtime.InteropServices;
          public static class Res {
            [DllImport("kernel32", SetLastError=true, CharSet=CharSet.Unicode)] public static extern IntPtr LoadLibraryEx(string f, IntPtr h, uint flags);
            [DllImport("kernel32")] public static extern IntPtr FindResource(IntPtr m, IntPtr name, IntPtr type);
            [DllImport("kernel32")] public static extern bool FreeLibrary(IntPtr m);
          }
          '@
          $name = "NTP-NTS-Diagnostic-Tool-${{ steps.version.outputs.version }}"
          $missing = @()
          foreach ($exe in @(Get-ChildItem "$name\*.exe") + @(Get-Item "out\$name-setup.exe")) {
            # LOAD_LIBRARY_AS_DATAFILE | LOAD_LIBRARY_AS_IMAGE_RESOURCE: read it, don't run it
            $m = [Res]::LoadLibraryEx($exe.FullName, [IntPtr]::Zero, 0x22)
            if ([Res]::FindResource($m, [IntPtr]1, [IntPtr]14) -eq [IntPtr]::Zero) { $missing += $exe.Name }
            [Res]::FreeLibrary($m) | Out-Null
          }
          if ($missing) { throw "No icon in: $($missing -join ', ')" }
          "Every program has the icon"
      - name: Install and remove it
        shell: pwsh
        run: |
          $name = "NTP-NTS-Diagnostic-Tool-${{ steps.version.outputs.version }}"
          $dir = "$env:LOCALAPPDATA\Programs\NTP-NTS Diagnostic Tool"
          $p = Start-Process "out\$name-setup.exe" -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "setup /S exited with $($p.ExitCode)" }
          & "$dir\ntpnts.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "installed ntpnts.exe did not run" }
          $p = Start-Process "$dir\uninstall.exe" -ArgumentList '/U', '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "uninstall /U /S exited with $($p.ExitCode)" }
          Start-Sleep -Seconds 5
          if (Test-Path "$dir\NTP-NTS-Diagnostic-Tool.exe") { throw "uninstall left the program behind" }
          "Installed and removed cleanly"
      - name: Release notes from the changelog
        shell: pwsh
        run: |
          $v = [regex]::Escape("${{ steps.version.outputs.version }}")
          $text = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($text, "(?ms)^## \[$v\][^\n]*\n(.*?)(?=^## \[|\z)")
          $notes = $m.Groups[1].Value.Trim()
          $notes += "`n`n## Downloads`n`n- ``*-setup.exe``: installs for you only (no administrator rights), adds a Start menu entry. ``/S`` installs silently.`n- ``*-portable.zip``: nothing to install.`n- ``SHA256SUMS.txt``: hashes of both."
          Set-Content -Encoding utf8 out-notes.md $notes
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: out
          if-no-files-found: error
      - name: Publish
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $pre = @(if ($env:GITHUB_REF_NAME.Contains('-')) { '--prerelease' })
          gh release create $env:GITHUB_REF_NAME (Get-ChildItem out).FullName --verify-tag --notes-file out-notes.md --title "NTP/NTS Diagnostic Tool $env:GITHUB_REF_NAME" @pre

  docs:
    needs: release
    if: github.ref_type == 'tag' || inputs.publish_docs
    runs-on: ubuntu-latest
    env:
      PUBLIC: optimusprime-nn/ntp-nts-diagnostic-tool
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Update the website and wiki
        env:
          GH_TOKEN: ${{ secrets.DOCS_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::DOCS_PAT is not set, so the website and wiki were not updated. See docs/wiki/Building-and-Releasing.md."
            exit 0
          fi
          RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/v${VERSION}"
          export RELEASE_URL DOWNLOAD_URL="$RELEASE_URL"
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${PUBLIC}.git" public
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${PUBLIC}.wiki.git" wiki
          bash scripts/publish-docs.sh public wiki
          for repo in public wiki; do
            git -C "$repo" config user.name 'github-actions[bot]'
            git -C "$repo" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git -C "$repo" add -A
            if git -C "$repo" diff --cached --quiet; then
              echo "$repo is up to date."
            else
              git -C "$repo" commit -q -m "Update docs for ${VERSION} (${GITHUB_REPOSITORY}@${GITHUB_SHA::8})"
              git -C "$repo" push -q
              echo "$repo updated."
            fi
          done
